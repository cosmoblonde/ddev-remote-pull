name: remote-pull

# Copied into the project's .ddev directory. Files with #ddev-generated are replaced by a later
# "ddev add-on get" and removed by "ddev add-on remove". remote-pull/config and config.local are not listed,
# so both leave them alone.
project_files:
  - commands/host/remote-pull
  - providers/live.yaml
  - providers/stage.yaml
  - remote-pull/remote-pull
  - remote-pull/config.dist
  - remote-pull/.gitignore

ddev_version_constraint: '>= v1.24.10'

# post_install_actions are executed in the context of the target project's .ddev directory.
post_install_actions:
  - |
    #ddev-description:Warn about own providers named live or stage
    for p in live stage; do
      if [ -f "providers/$p.yaml" ] && ! grep -q '#ddev-generated' "providers/$p.yaml"; then
        echo "WARNING: .ddev/providers/$p.yaml has no #ddev-generated line and was not replaced."
        echo "\"ddev pull $p\" keeps using it. Rename it or delete it and run \"ddev add-on get\" again."
      fi
    done
  - |
    #ddev-description:Make the commands executable
    chmod +x commands/host/remote-pull remote-pull/remote-pull
  - |
    #ddev-description:Create remote-pull/config from config.dist if it does not exist yet
    if [ ! -f remote-pull/config ]; then
      grep -v '#ddev-generated' remote-pull/config.dist > remote-pull/config
      echo "remote-pull/config created: fill in the sources, then \"ddev remote-pull check\"."
    fi

# removal_actions are executed in the context of the target project's .ddev directory.
removal_actions:
  - |
    #ddev-description:Keep the config, remove the folder if it is empty now
    rmdir remote-pull 2>/dev/null || true
    if [ -d remote-pull ]; then
      echo "remote-pull/ holds the config and stays in place."
    fi

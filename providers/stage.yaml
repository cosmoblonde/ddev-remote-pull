#ddev-generated
# "ddev pull stage": database and files from the section [stage] of .ddev/remote-pull/config.
# Every step runs on the host, so ssh uses your own keys, ssh-agent and ~/.ssh/config.
# One run only: ddev pull stage --environment="EMPTY_TABLES=cache_* sys_log,BACKUP=0"
# More sources: copy this file under the name of the new section, replace "stage" and remove the
# #ddev-generated line.

info_command:
  command: .ddev/remote-pull/remote-pull info stage
  service: host

auth_command:
  command: .ddev/remote-pull/remote-pull auth stage
  service: host

db_pull_command:
  command: .ddev/remote-pull/remote-pull db stage
  service: host

# backup of the local database, then ddev import-db; ddev pull runs the import-db hooks around it
db_import_command:
  command: .ddev/remote-pull/remote-pull import stage
  service: host

# nothing to download first: the import step syncs straight into the project with rsync
files_pull_command:
  command: "true"
  service: host

files_import_command:
  command: .ddev/remote-pull/remote-pull files stage
  service: host
